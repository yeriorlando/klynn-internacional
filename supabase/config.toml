project_id = "lqtjwcphidbwiwrnqbac"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"

[functions.polar-webhook]
verify_jwt = false

[functions.pronesoft-webhook]
enabled = true
# Pronesoft no envía un JWT de Supabase. La función valida la firma HMAC con
# PRONESOFT_WEBHOOK_SECRET antes de procesar el payload.
verify_jwt = false
import_map = "./functions/pronesoft-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/pronesoft-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/pronesoft-webhook/*.html" ]

[functions.pronesoft-proxy]
verify_jwt = true

[functions.employee-invitations]
verify_jwt = true

[functions.weekly-business-summary]
# El endpoint valida JWT para pruebas manuales y x-cron-secret para el programador.
verify_jwt = false
