    function switchTemplate(name) {
      const frame = document.getElementById('email-frame');
      frame.srcdoc = templates[name];

      ['otp', 'recovery', 'welcome'].forEach(key => {
        const btn = document.getElementById('btn-' + key);
        if (btn) {
          btn.className = key === name 
            ? 'px-4 py-2 rounded-lg text-xs font-bold transition-all bg-[#1B4B73] text-white shadow'
            : 'px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';
        }
      });

      frame.style.height = name === 'welcome' ? '650px' : '580px';
    }

    function setFrameWidth(w) {
      document.getElementById('frame-wrapper').style.maxWidth = w === '100%' ? '520px' : '380px';
    }

    // Inicializar
    switchTemplate('welcome');
  </script>
